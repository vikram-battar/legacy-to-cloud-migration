name: CI

# Every push: build the image, run the tests, scan it, and stop.
# Nothing reaches ECR from this workflow — deploys are separate on purpose.
on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: legacy-inventory-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install flask pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f container/Dockerfile -t $IMAGE_NAME:${{ github.sha }} .

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        run: docker build -f container/Dockerfile -t $IMAGE_NAME:${{ github.sha }} .

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
